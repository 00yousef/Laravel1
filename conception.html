<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diagrammes de conception de Billio : cas d’utilisation, classes, séquences, états, activité et données." />
    <title>Conception | Billio</title>
    <style>
      .diagram-rendered svg { max-width: none; }
    </style>
  </head>
  <body
    data-conception-page
    x-data="conceptionPage"
    x-init="darkMode = JSON.parse(localStorage.getItem('darkMode') || 'false'); $watch('darkMode', value => { localStorage.setItem('darkMode', JSON.stringify(value)); window.dispatchEvent(new CustomEvent('billio:theme-change', { detail: { dark: value } })) })"
    x-on:keydown.escape.window="modalOpen = false"
    x-on:billio:diagrams-loaded.window="setDiagrams($event.detail.diagrams)"
    x-on:billio:diagrams-rendered.window="refreshDiagramModal()"
    x-on:billio:diagram-verification.window="setVerification($event.detail.id, $event.detail.result)"
    x-on:billio:diagram-load-error.window="loadError = $event.detail.message"
    :class="{'dark bg-gray-900': darkMode}"
  >
    <include src="./partials/public-nav.html"></include>
    <main class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
      <header class="mb-10 max-w-3xl">
        <p class="text-sm font-semibold tracking-wide text-brand-500 uppercase">Dossier de conception</p>
        <h1 class="mt-3 text-4xl font-bold text-gray-900 dark:text-white">Diagrammes de Billio</h1>
        <p class="mt-4 text-lg leading-8 text-gray-600 dark:text-gray-300">Explorez les diagrammes fonctionnels et techniques du projet. Chaque schéma reprend directement sa source depuis le module de données de conception.</p>
      </header>

      <p x-show="loadError" x-cloak x-text="loadError" role="alert" class="mb-6 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-300"></p>
      <p x-show="!loadError && diagrams.length === 0" x-cloak class="mb-6 text-sm text-gray-500 dark:text-gray-400">Chargement des diagrammes…</p>

      <div class="space-y-8">
        <template x-for="diagram in diagrams" :key="diagram.id">
          <section
            data-diagram-card
            :data-diagram-id="diagram.id"
            :data-diagram-title="diagram.title"
            class="rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm sm:p-7 dark:border-gray-800 dark:bg-gray-800"
          >
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h2 class="text-xl font-semibold text-gray-900 dark:text-white" x-text="diagram.title"></h2>
              <div class="flex flex-wrap gap-2">
                <button type="button" @click="openDiagram($event)" class="rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-gray-700">Full screen</button>
                <button type="button" @click="downloadDiagram($event)" class="rounded-lg bg-brand-500 px-3 py-2 text-sm font-medium text-white hover:bg-brand-600">Download SVG</button>
              </div>
            </div>
            <div class="diagram-viewport mt-5 max-h-[70vh] min-h-64 overflow-auto rounded-xl border border-gray-200 bg-gray-50 p-4 dark:border-gray-700 dark:bg-gray-900">
              <div class="diagram-rendered min-w-max min-h-56" :id="'diagram-' + diagram.id" aria-live="polite"></div>
            </div>
            <p class="diagram-error mt-3 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700 dark:border-red-900 dark:bg-red-950 dark:text-red-300" role="alert" hidden></p>
            <div x-show="verifications[diagram.id]" x-cloak class="mt-4 rounded-lg bg-gray-50 p-4 text-sm dark:bg-gray-900">
              <p class="font-medium text-gray-800 dark:text-gray-200" x-text="verifications[diagram.id]?.summary"></p>
              <ul x-show="verifications[diagram.id]?.items?.length" class="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-gray-600 dark:text-gray-400">
                <template x-for="item in (verifications[diagram.id]?.items || [])" :key="item"><li x-text="item"></li></template>
              </ul>
            </div>
          </section>
        </template>
      </div>
    </main>

    <div
      x-cloak
      x-show="modalOpen"
      x-transition.opacity
      @click.self="modalOpen = false"
      class="fixed inset-0 z-[100000] flex flex-col bg-white p-4 sm:p-8 dark:bg-gray-950"
      role="dialog"
      aria-modal="true"
      :aria-label="modalTitle"
    >
      <div class="mb-4 flex items-center justify-between gap-4">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white" x-text="modalTitle"></h2>
        <button type="button" @click="modalOpen = false" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-gray-800">Close <span aria-hidden="true">×</span></button>
      </div>
      <div class="min-h-0 flex-1 overflow-auto rounded-xl border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-gray-900" x-html="modalSvg"></div>
    </div>
  </body>
</html>
